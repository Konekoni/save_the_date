<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Imperial Interactiva</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00e5ff;
            --rebel-red: #ff4d4d;
            --current-theme: var(--cyan);
        }

        html, body {
            margin: 0;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            color: var(--current-theme);
            color-scheme: dark;
            transition: color 0.5s;
        }

        .rebel-mode {
            --current-theme: var(--rebel-red);
        }

        .rebel-mode #mainText,
        .rebel-mode #names,
        .rebel-mode #date,
        .rebel-mode #boadillaText,
        .rebel-mode #impCommText {
            color: var(--rebel-red) !important;
        }

        .rebel-mode #cursor {
            background: var(--rebel-red) !important;
        }

        .rebel-mode .holo-filter {
            filter:
                brightness(0) invert(1) sepia(1) saturate(10)
                hue-rotate(330deg) brightness(1.2) contrast(1.1)
                drop-shadow(0 0 1.5vh var(--rebel-red));
        }

        .rebel-mode .beam {
            background: radial-gradient(ellipse at bottom, rgba(255,77,77,0.5), transparent 70%);
        }

        .rebel-mode .separator-line {
            border-color: rgba(255, 77, 77, 0.4);
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.2);
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.05) 0px,
                rgba(255,255,255,0.05) 0.3vh,
                transparent 0.3vh,
                transparent 0.6vh
            );
            pointer-events: none;
            z-index: 99999;
        }

        .holo-filter {
            filter:
                brightness(0) invert(1) sepia(1) saturate(12)
                hue-rotate(165deg) brightness(0.9) contrast(1.15)
                drop-shadow(0 0 1.5vh var(--cyan));
            mix-blend-mode: screen;
            transition: filter 0.5s;
        }

        .separator-line {
            position: absolute;
            left: 5%;
            right: 5%;
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.15);
            z-index: 50;
            pointer-events: none;
        }
        .sep-top { top: 12vh; }
        .sep-bottom { bottom: 12vh; }

        .ship-container {
            position: absolute;
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 46%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-out;
            z-index: 60;
        }

        .ship-deco {
            width: clamp(25px, 7vw, 50px);
            margin-right: 6px;
        }

        .ship-data {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(5px, 1.6vw, 6.5px);
            line-height: 1.1;
            text-transform: uppercase;
            color: inherit;
            border-left: 1px solid currentColor;
            padding-left: 5px;
            opacity: 0.8;
            white-space: pre;
        }

        .pos-1 { top: 2vh; left: 2%; justify-content: flex-start; }
        .pos-2 { top: 2vh; right: 2%; justify-content: flex-end; }
        .pos-3 { bottom: 2vh; left: 2%; justify-content: flex-start; }
        .pos-4 { bottom: 2vh; right: 2%; justify-content: flex-end; }

        #intro, #loading, #access {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: black;
        }

        .loading-top-emblem {
            position: absolute;
            top: 4vh;
            width: 45px;
            opacity: 0.8;
        }
        
        #accessText {
            color: #00ff7f;
            font-size: 24px;
            letter-spacing: 0.4em;
            text-align: center;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        #accessText.terminal-message {
            opacity: 1;
            transform: scale(1);
            border: 1px solid rgba(0, 255, 127, 0.6);
            padding: 14px 22px;
            background: rgba(0, 255, 127, 0.06);
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.25);
        }

        .fixed-layout-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 350px;
            justify-content: flex-start;
        }

        #intro-logo {
            width: 60px;
            margin-bottom: 20px;
        }

        .loading-holo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 95%;
            max-width: 500px;
            margin-top: 5vh;
        }

        #loadingShip {
            width: 100px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .loading-text-block {
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        #loadingText {
            margin-bottom: 15px;
            font-size: 11px;
            letter-spacing: 0.2em;
            opacity: 0.85;
            min-height: 18px;
        }

        .imperial-block {
            position: absolute; top: 14vh; width: 100%; text-align: center;
            opacity: 0; transition: opacity 1s; font-size: 10px;
            z-index: 200; letter-spacing: 0.2em;
            cursor: pointer;
        }
        .imperial-block.show { opacity: 1; }
        .imperial-block img { width: 32px; margin-bottom: 0.4vh; }

        #signal-noise {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.1);
            display: none;
            z-index: 100000;
            pointer-events: none;
        }

        .noise-active #signal-noise {
            display: block;
            animation: noise-anim 0.1s infinite;
        }

        @keyframes noise-anim {
            0% { transform: translateX(-5px); opacity: 0.5; }
            50% { transform: translateX(5px); opacity: 0.8; }
            100% { transform: translateY(2px); opacity: 0.5; }
        }

        /* Estilos para el efecto de slice glitch */
        .glitch-slice {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--current-theme);
            opacity: 0.3;
            pointer-events: none;
            z-index: 100001;
            box-shadow: 0 0 10px var(--current-theme);
        }

        .text-main {
            position: absolute; top: 22vh; width: 100%; text-align: center;
            font-size: clamp(26px, 5.5vw, 44px); z-index: 20;
        }

        .scene {
            position: absolute; top: 40vh; left: 50%;
            transform: translate(-50%, -50%); perspective: 1000px; z-index: 5;
        }
        .holo {
            position: relative; width: 24vh; height: 24vh; transform-style: preserve-3d;
            opacity: 0; transition: opacity 3s ease-in;
        }
        .holo.on { opacity: 0.8; animation: rotateY 18s linear infinite; }

        @keyframes rotateY { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .text-bottom {
            position: absolute; top: 58vh; width: 100%; text-align: center;
            font-size: clamp(20px, 4.5vw, 36px); z-index: 20;
        }

        .boadilla {
            position: absolute; bottom: 13vh; left: 50%; transform: translateX(-50%);
            text-align: center; opacity: 0; transition: opacity 1s;
            font-size: clamp(14px, 3vw, 18px); z-index: 10; width: 100%;
            cursor: pointer;
        }

        .beam {
            position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 50vh;
            background: radial-gradient(ellipse at bottom, rgba(0,229,255,0.5), transparent 70%);
            filter: blur(5vh); opacity: 0;
            transition: opacity 4s ease-out;
            z-index: 1; pointer-events: none;
        }
        .beam.on { opacity: 1; }

        #biometric-btn { width: 100px; cursor: pointer; animation: pulse 2s infinite; margin-top: 20px;}
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        #cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--cyan);
            margin-left: 5px;
            animation: blink 1s steps(1) infinite;
            vertical-align: middle;
        }
        
        #telemetryStream {
            width: 85%;
            max-width: 450px;
            margin: 0 auto;
            height: 220px;
            overflow: hidden;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            line-height: 1.4;
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding: 15px 10px;
            opacity: 0.85;
            white-space: pre-wrap;
            position: relative;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <div class="scanlines"></div>
    <div id="signal-noise"></div>

    <div id="intro">
        <div class="fixed-layout-container">
            <img id="intro-logo" src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="holo-filter">
            <div id="introTitle" style="margin-bottom:2vh; font-size: clamp(20px, 5vw, 32px); height: 40px;"></div>
            <div id="introTouch" style="opacity:0.6; letter-spacing:0.3em; margin-bottom:4vh; font-size: 12px; height: 20px;"></div>
            <div style="height: 120px; display: flex; align-items: center; justify-content: center;">
                <img id="biometric-btn" src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/880868.png" alt="Scanner" style="display:none;" class="holo-filter">
            </div>
        </div>
    </div>

    <div id="loading" style="display:none;">
        <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="loading-top-emblem holo-filter">
        <div class="loading-holo-container">
            <img id="loadingShip" src="https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/nave-espacial-10.gif" class="holo-filter">
            <div class="loading-text-block">
                <div id="loadingText"></div>
                <div id="telemetryStream"></div>
            </div>
        </div>
    </div>

    <div id="access" style="display:none;">
        <div id="accessText" style="letter-spacing: 0.5em; font-size: 24px;"></div>
    </div>
    
    <div id="content" style="display:none;">
        <div class="separator-line sep-top"></div>
        <div class="separator-line sep-bottom"></div>

        <div class="ship-container pos-1">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-1"></div>
        </div>
        
        <div class="ship-container pos-2">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-2"></div>
        </div>

        <div class="ship-container pos-3">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-3"></div>
        </div>

        <div class="ship-container pos-4">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-4"></div>
        </div>

        <div class="imperial-block" onclick="triggerHack()">
            <img id="main-logo" src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="holo-filter">
            <div id="impCommText"></div>
        </div>

        <div class="text-main">
            <span id="mainText"></span><span id="cursor" style="display:none;"></span>
        </div>

        <div class="scene">
            <div class="holo">
                <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png" style="width:100%; height:100%; object-fit:contain;" class="holo-filter">
            </div>
        </div>

        <div class="text-bottom">
            <div id="names"></div>
            <div id="date" style="margin-top: 5px;"></div>
        </div>

        <div class="beam"></div>

        <div class="boadilla" id="boadilla" onclick="triggerWarp()">
            <div class="planet">
                <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/background-with-geometric-linear-sphere.png" style="width:70px;" class="holo-filter">
            </div>
            <div id="boadillaText"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let warpState = "IDLE"; 
        let warpFactor = 0;
        let warpLength = 1;

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 400; i++) {
                addStar(true);
            }
        }

        function addStar(randomDist = false) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.2,
                speed: Math.random() * 0.2 + 0.05,
                opacity: Math.random() * 0.5 + 0.5
            });
        }

        function drawStars() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const dx = star.x - centerX;
                const dy = star.y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx);

                if (warpState !== "IDLE") {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.lineWidth = star.size;
                    ctx.beginPath();
                    ctx.moveTo(star.x, star.y);
                    const stretch = warpLength * (dist / 100);
                    ctx.lineTo(star.x + Math.cos(angle) * stretch, star.y + Math.sin(angle) * stretch);
                    ctx.stroke();
                    star.x += Math.cos(angle) * warpFactor * (dist / 150 + 0.5);
                    star.y += Math.sin(angle) * warpFactor * (dist / 150 + 0.5);

                    if (star.x < 0 || star.x > canvas.width || star.y < 0 || star.y > canvas.height) {
                        star.x = centerX + (Math.random() - 0.5) * 20;
                        star.y = centerY + (Math.random() - 0.5) * 20;
                    }
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    star.y += star.speed;
                    if (star.y > canvas.height) star.y = 0;
                }
            }

            if (warpState === "STRETCHING") {
                warpFactor += 0.05;
                warpLength += 0.4;
                if (warpLength >= 12) warpState = "ACCELERATING";
            } else if (warpState === "ACCELERATING") {
                warpFactor += 1.2;
                warpLength += 3.5;
                if (warpFactor >= 45) warpState = "BRAKING";
            } else if (warpState === "BRAKING") {
                warpFactor *= 0.92; 
                warpLength *= 0.88; 
                if (warpLength < 1.1) {
                    warpFactor = 0;
                    warpLength = 1;
                    warpState = "IDLE";
                }
            }
            requestAnimationFrame(drawStars);
        }

        /**
         * Función Glitch Slice: Genera cortes horizontales y desplazamientos.
         * @param {number} intensity - Número de cortes.
         * @param {number} duration - Duración en ms.
         */
        function triggerGlitchSlice(intensity = 5, duration = 200) {
            const body = document.body;
            for(let i=0; i<intensity; i++) {
                const slice = document.createElement('div');
                slice.className = 'glitch-slice';
                const topPos = Math.random() * 100;
                const h = Math.random() * 10 + 2;
                slice.style.top = topPos + 'vh';
                slice.style.height = h + 'px';
                slice.style.transform = `translateX(${(Math.random() - 0.5) * 30}px)`;
                document.body.appendChild(slice);
                
                // Desplazamiento sutil aleatorio de todo el body
                body.style.transform = `translateX(${(Math.random() - 0.5) * 10}px)`;

                setTimeout(() => {
                    slice.remove();
                    body.style.transform = '';
                }, duration);
            }
        }

        // Glitch ambiental aleatorio (poco habitual)
        setInterval(() => {
            if (document.getElementById("content").style.display !== "none" && Math.random() > 0.96) {
                triggerGlitchSlice(2, 100);
            }
        }, 2000);

        function triggerWarp() {
            if (warpState !== "IDLE") return;
            warpState = "STRETCHING";
            setTimeout(() => {
                if (warpState !== "IDLE") warpState = "BRAKING";
            }, 2200); 
        }

        function triggerHack() {
            updateShipData();
            document.body.classList.add('noise-active');
            
            // Hackeo intenso: ráfagas de glitch slice
            const glitchInterval = setInterval(() => triggerGlitchSlice(8, 150), 100);

            setTimeout(() => {
                clearInterval(glitchInterval);
                document.body.classList.remove('noise-active');
                const isRebel = document.body.classList.toggle('rebel-mode');
                const logo = document.getElementById('main-logo');
                const text = document.getElementById('impCommText');
                
                if (isRebel) {
                    logo.src = "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/Rebel_Alliance_logo.svg.png";
                    text.textContent = "REBEL INTERFERENCE DETECTED";
                } else {
                    logo.src = "https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp";
                    text.textContent = "IMPERIAL COMMUNICATION SYSTEM";
                }
            }, 500);
        }
        
      const shipGifs = [
          "https://uploads.onecompiler.io/44nfcewhu/44nkt6qmh/nave-espacial-14.gif",
          "https://uploads.onecompiler.io/44nfcewhu/44nkt6qmh/nave-espacial-18.gif",
          "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/nave-espacial-17.gif",
          "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/nave-espacial-19.gif",
          "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/nave-espacial-10.gif",
          "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/nave-espacial-9.gif"
      ];

      
      function pickRandomShips() {
          return [...shipGifs].sort(() => Math.random() - 0.5).slice(0, 4);
      }

      const shipSpecs = [
          { id: "TIE/X1-77", class: "TIE INTERCEPTOR", mission: "ESCORT DETAIL", destination: "CORUSCANT" },
          { id: "SCT-V9", class: "RECON SCOUT", mission: "RECON SWEEP", destination: "NABOO" },
          { id: "FRG-C1", class: "SUPPLY FRIGATE", mission: "SURVEILLANCE", destination: "TATOOINE" },
          { id: "CRU-H1", class: "HEAVY CRUISER", mission: "SECTOR PATROL", destination: "SCARIF" }
      ];
      
      const shipRuntimeData = shipSpecs.map(spec => ({
          shield: rand(82, 100),
          velocity: rand(40, 120),
          coordX: rand(10, 99) + rand(0, 99) / 100,
          coordY: rand(10, 99) + rand(0, 99) / 100
      }));
      
      function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      
      function fluctuate(value, min, max, delta = 1) {
          value += (Math.random() * delta * 2) - delta;
          if (value < min) value = min;
          if (value > max) value = max;
          return value;
      }
      
      function generateShipTelemetry(spec, runtime) {
          const rebelMode = document.body.classList.contains("rebel-mode");
          if (rebelMode) {
              return `ID:          ${spec.id}\nCLASS:       ${spec.class}\nMISSION:     SIGNAL LOST\nDESTINATION: UNKNOWN\nSHIELD:      OFFLINE\nVELOCITY:    0000 MGLT\nCOORD:       [MISSING LOC.]`;
          }
          runtime.shield = fluctuate(runtime.shield, 72, 100, 0.4);
          runtime.velocity = fluctuate(runtime.velocity, 20, 120, 1.2);
          runtime.coordX = fluctuate(runtime.coordX, 10, 99, 0.03);
          runtime.coordY = fluctuate(runtime.coordY, 10, 99, 0.03);
          return `ID:          ${spec.id}\nCLASS:       ${spec.class}\nMISSION:     ${spec.mission}\nDESTINATION: ${spec.destination}\nSHIELD:      ${Math.round(runtime.shield)}%\nVELOCITY:    ${Math.round(runtime.velocity)} MGLT\nCOORD:       [${runtime.coordX.toFixed(2)}, ${runtime.coordY.toFixed(2)}]`;
      }
      
      function updateShipData() {
          for (let i = 1; i <= 4; i++) {
              const el = document.getElementById(`data-${i}`);
              if (!el) continue;
              el.textContent = generateShipTelemetry(shipSpecs[i - 1], shipRuntimeData[i - 1]);
          }
      }

      const telemetryTemplates = [
      `      VESSEL ID ....................... ISD-${Math.floor(Math.random()*999)}
      REACTOR OUTPUT .................. ${rand(82, 100)}%
      SHIELD INTEGRITY ................ ${rand(70, 100)}%
      HYPERDRIVE STATUS ............... ONLINE
      THREAT ANALYSIS ................. LOW`,
      
      `      SCANNING NEARBY VESSELS.............
      COMM INTERFERENCE ............... ${rand(0,100)}%
      TARGET LOCK ..................... CONFIRMED
      SCAN RESOLUTION ................. ${rand(80,100)}%
      SIGNAL CLARITY .................. OPTIMAL`,
    
      `      POWER GRID LOAD ................. ${rand(400,900)} MW
      FUEL RESERVES ................... ${rand(60,100)}%
      LIFE SUPPORT .................... NOMINAL
      NEXT JUMP WINDOW ................ ${rand(5,90)} sec
      COOLANT SYSTEM .................. STABLE`,
      
      `      TACTICAL UPLINK ................. SYNCHRONIZED
      IMPERIAL NETWORK ................ STABLE
      AUTHORIZATION .................. VERIFIED
      ENCRYPTION LEVEL ............... ALPHA-7
      SECURITY PROTOCOL .............. ACTIVE`
      ];
        
        let telemetryInterval;
        function startTelemetryStream() {
            const stream = document.getElementById("telemetryStream");
            telemetryInterval = setInterval(() => {
                const block = telemetryTemplates[Math.floor(Math.random() * telemetryTemplates.length)];
                stream.innerHTML += block + "\n\n";
                if (stream.innerHTML.length > 2000) stream.innerHTML = stream.innerHTML.slice(800);
                stream.scrollTop = stream.scrollHeight;
            }, 120);
        }
        function stopTelemetryStream() { clearInterval(telemetryInterval); }

        function type(el, text, defaultSpeed, callback, pauses = {}) {
            let i = 0; el.textContent = "";
            function t() {
                if (i < text.length) { 
                    el.textContent += text[i];
                    let currentPause = pauses[i] || 0;
                    i++;
                    setTimeout(t, defaultSpeed + currentPause); 
                }
                else if (callback) callback();
            }
            t();
        }

        window.onload = () => {
            initStars();
            drawStars();
            setInterval(updateShipData, 120);
            
            type(document.getElementById("introTitle"), "IMPERIAL TRANSMISSION", 50, () => {
                type(document.getElementById("introTouch"), "confirm identity to proceed", 40, () => {
                    document.getElementById("biometric-btn").style.display = "block";
                });
            });
        };

        document.getElementById("biometric-btn").onclick = () => {
            const intro = document.getElementById("intro");
            const loading = document.getElementById("loading");
            intro.style.display = "none";
            loading.style.display = "flex";
            const loadingShip = document.getElementById("loadingShip");
            loadingShip.src = pick(shipGifs);
            startTelemetryStream();

            type(loadingText, "SCANNING SHIP SIGNATURE...", 30, () => {
                setTimeout(() => {
                    loadingText.textContent = "";
                    type(loadingText, "VERIFYING IMPERIAL CLEARANCE...", 30, () => {
                        setTimeout(() => {
                            loading.style.display = "none";
                            stopTelemetryStream();
                            const access = document.getElementById("access");
                            access.style.display = "flex";
                            const accessText = document.getElementById("accessText");
                            accessText.textContent = "ACCESS GRANTED";
                            accessText.classList.add("terminal-message");
                            setTimeout(() => {
                                access.style.opacity = "0";
                                setTimeout(startMainScene, 800);
                            }, 1200);
                        }, 1500);
                    });
                }, 800);
            });
        };

        function startMainScene() {
            document.getElementById("access").style.display = "none";
            document.getElementById("content").style.display = "block";
            
            // Aparecen las 4 naves al mismo tiempo (IMPORTANTE)
            document.querySelectorAll('.ship-container').forEach((c) => {
                c.style.opacity = "1";
            });
            
            const selectedShips = pickRandomShips();
            document.querySelectorAll('.ship-container img').forEach((img, i) => {
                img.src = selectedShips[i];
            });

            setTimeout(() => {
                document.querySelector(".imperial-block").classList.add("show");
                type(document.getElementById("impCommText"), "IMPERIAL COMMUNICATION SYSTEM", 40, () => {
                    
                    setTimeout(() => {
                        document.querySelector(".beam").classList.add("on");
                        setTimeout(() => {
                            document.querySelector(".holo").classList.add("on");
                            
                            setTimeout(() => {
                                document.getElementById("cursor").style.display = "inline-block";
                                const stdText = "Save the date...";
                                const stdPauses = { 3: 600, 7: 600, 12: 400 };
                                type(document.getElementById("mainText"), stdText, 120, () => {
                                    setTimeout(typeFinalInfo, 800);
                                }, stdPauses);
                            }, 1500);
                        }, 1200); 
                    }, 800);
                });
            }, 1000);
        }

        function typeFinalInfo() {
            type(document.getElementById("names"), "Irene & Nacho", 60, () => {
                setTimeout(() => {
                    type(document.getElementById("date"), "15.05.2027", 60, () => {
                        setTimeout(() => {
                            document.getElementById("boadilla").style.opacity = "1";
                            type(document.getElementById("boadillaText"), "BOADILLA", 80);
                        }, 600);
                    });
                }, 400);
            });
        }

        window.onresize = initStars;
    </script>
</body>
</html>
