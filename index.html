<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Transmission</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00e5ff;
            --rebel-red: #ff4d4d;
            --current-theme: var(--cyan);
        }
        html, body {
            margin: 0;
            height: 100%;
            background: black;
            overflow: auto;
            overscroll-behavior-y: auto;
            font-family: 'Orbitron', monospace;
            color: var(--current-theme);
            color-scheme: dark;
            transition: color 0.5s;
            user-select: text;
        }

        .rebel-mode {
            --current-theme: var(--rebel-red);
        }
        
        /* Botón de Salto Global (Siempre activo) */
        #skip-all {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 999999; /* Por encima de TODO */
            cursor: pointer;
            opacity: 0.03; /* Prácticamente invisible */
            background: transparent;
            border: none;
            color: white;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        
        #skip-all:active {
            opacity: 0.2;
            background: rgba(255,255,255,0.1);
        }

        /* Estilos de Intro Centralizados */
        #introTitle {
            margin-bottom: 2vh;
            font-size: clamp(18px, 5vw, 32px);
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        #introTouch {
            opacity: 0.6;
            letter-spacing: 0.3em;
            margin-bottom: 4vh;
            font-size: clamp(10px, 3vw, 15px);
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        #security-scan-btn {
            display: none;
            background: transparent;
            color: var(--current-theme);
            border: 2px solid var(--current-theme);
            padding: 15px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            animation: pulse 2s infinite;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        #security-scan-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
        }

        .rebel-mode #security-scan-btn {
            border-color: var(--rebel-red);
            color: var(--rebel-red);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.3);
        }

        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.8; } 
            50% { transform: scale(1.05); opacity: 1; } 
        }

        .rebel-mode #mainText,
        .rebel-mode #names,
        .rebel-mode #date,
        .rebel-mode #boadillaText,
        .rebel-mode #impCommText {
            color: var(--rebel-red) !important;
        }

        .rebel-mode #cursor {
            background: var(--rebel-red) !important;
        }

        .rebel-mode .holo-filter {
            filter:
                brightness(0.6) invert(1) sepia(1) saturate(10)
                hue-rotate(330deg) brightness(1.2) contrast(1.1)
                drop-shadow(0 0 1.5vh var(--rebel-red));
        }

        .rebel-mode .beam {
            background: radial-gradient(ellipse at bottom, rgba(255,77,77,0.5), transparent 70%);
        }

        .rebel-mode .separator-line {
            border-color: rgba(255, 77, 77, 0.4);
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.2);
        }
        
        .rebel-mode #velocityHud, .rebel-mode #countdownHud {
            border-color: rgba(255,77,77,0.4);
            box-shadow: 0 0 10px rgba(255,77,77,0.2);
        }

        .secret-barcode {
            position: absolute;
            line-height: 0.8;
            display: flex;
            left: 0;
            width: 100%;
            text-align: justify;
            text-align-last: justify;
            font-family: 'Libre Barcode 39';
            font-size: clamp(20px, 4vw, 18px);
            opacity: 0.5;
            letter-spacing: 2px;
            z-index: 5;
            padding: 10px 0 2px 0;
            color: var(--cyan);
            user-select: all;
            white-space: nowrap; /* Asegura una sola línea aunque desborde */
        }
        
        .secret-barcode::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            border-top: 3px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }
        
        .secret-barcode::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: 3px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        .barcode-top { top: 2vh; }
        .barcode-bottom { bottom: 2vh; }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.05) 0px,
                rgba(255,255,255,0.05) 0.3vh,
                transparent 0.3vh,
                transparent 0.6vh
            );
            pointer-events: none;
            z-index: 99999;
        }

        .holo-filter {
            filter:
                brightness(0.85)
                contrast(1.5)
                invert(1)
                sepia(1)
                saturate(11)
                hue-rotate(165deg)
                brightness(1.15)
                contrast(1.1)
                drop-shadow(0 0 1.5vh var(--cyan));
        
            mix-blend-mode: screen;
        }

        .separator-line {
            position: absolute;
            left: 5%;
            right: 5%;
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.15);
            z-index: 50;
            pointer-events: none;
        }
        .sep-top { top: 11vh; }
        .sep-bottom { bottom: 11vh; }

        #content {
            position: relative;
            z-index: 500;
            width: 100%;
            height: 100%;
        }
        
        
        .hud-panel {
            position: absolute;
            bottom: 13vh;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--current-theme);
            padding: 2px 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            pointer-events: none;
            display: flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
            width: 85px; /* Anchura fija igualada */
            justify-content: flex-end;
        }

        #velocityHud {
            right: 5%;
            left: auto;
        }

        #countdownHud {
            left: 5%;
            right: auto;
            width: 100px; /* Un poco más ancho para el tiempo largo */
            justify-content: center;
        }

        #vDigits, #cDigits {
            display: inline-block;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px; 
        }

        #vUnit, #cUnit {
            font-size: 8px;
            opacity: 0.7;
            margin-left: 2px; 
        }

        .overload {
            color: var(--rebel-red) !important;
            border-color: var(--rebel-red) !important;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            animation: warning-blink 0.3s infinite;
        }

        @keyframes warning-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .ship-container {
            position: absolute;
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 60%; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-out;
            z-index: 60;
        }

        .ship-deco {
            width: clamp(40px, 9vw, 90px); /* Tamaño del GIF aumentado significativamente */
            margin-right: 10px;
            flex-shrink: 0; /* Evita que el GIF se aplaste si hay mucho texto */
        }

        .ship-data {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(6px, 2vw, 7px);
            line-height: 1.4;
            text-transform: uppercase;
            color: inherit;
            border-left: 1px solid currentColor;
            border-right: 1px solid currentColor;
            padding-right: 4px;
            padding-left: 4px;
            opacity: 0.8;
            white-space: pre;
        }

        .rebel-blink {
            animation: warning-blink 0.5s step-end infinite;
        }


        .pos-1,
        .pos-2 {
            top: 0;
            height: 11vh;
            display: flex;
            align-items: center;
        }
        
        .pos-3,
        .pos-4 {
            bottom: 0;
            height: 11vh;
            display: flex;
            align-items: center;
        }
        
        .pos-1 {
            left: 5%;
            justify-content: flex-start;
        }
        
        .pos-2 {
            right: 5%;
            justify-content: flex-end;
        }
        
        .pos-3 {
            left: 5%;
            justify-content: flex-start;
        }
        
        .pos-4 {
            right: 5%;
            justify-content: flex-end;
        }

        #intro, #loading, #access {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: black;
        }

        .loading-top-emblem {
            position: absolute;
            top: 4vh;
            width: 45px;
            opacity: 0.8;
        }
        
        #accessText {
            color: #00ff7f;
            font-size: 24px;
            letter-spacing: 0.4em;
            text-align: center;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #accessText.terminal-message {
            opacity: 1;
            transform: scale(1);
            border: 1px solid rgba(0, 255, 127, 0.6);
            padding: 14px 22px;
            background: rgba(0, 255, 127, 0.06);
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.25);
        }

        .fixed-layout-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 350px;
            justify-content: flex-start;
            position: relative;
            z-index: 10;
            width: 90%;
        }

        #intro-logo {
            width: 60px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .loading-holo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 95%;
            max-width: 500px;
            margin-top: 5vh;
            transition: opacity 0.6s ease;
        }

        #loadingShip {
            width: 100px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .loading-text-block {
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            user-select: text;
        }
        
        #loadingText {
            margin-bottom: 15px;
            font-size: 15px;
            letter-spacing: 0.2em;
            opacity: 0.85;
            min-height: 18px;
        }

        .imperial-block {
            position: absolute; top: 14vh; width: 100%; text-align: center;
            opacity: 0; transition: opacity 1s; font-size: 10px;
            z-index: 200; letter-spacing: 0.2em;
            cursor: pointer;
        }
        .imperial-block.show { opacity: 1; }
        .imperial-block img { width: 32px; margin-bottom: 0.4vh; }

        #signal-noise {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.1);
            display: none;
            z-index: 100000;
            pointer-events: none;
        }

        .noise-active #signal-noise {
            display: block;
            animation: noise-anim 0.1s infinite;
        }

        @keyframes noise-anim {
            0% { transform: translateX(-5px); opacity: 0.5; }
            50% { transform: translateX(5px); opacity: 0.8; }
            100% { transform: translateY(2px); opacity: 0.5; }
        }

        .glitch-slice {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--current-theme);
            opacity: 0.3;
            pointer-events: none;
            z-index: 100001;
            box-shadow: 0 0 10px var(--current-theme);
        }

        .text-main {
            position: absolute; top: 22vh; width: 100%; text-align: center;
            font-size: clamp(26px, 5.5vw, 44px); z-index: 20;
            pointer-events: auto;
        }

        .scene {
            position: absolute; top: 40vh; left: 50%;
            transform: translate(-50%, -40%); perspective: 1000px; z-index: 5;
        }
        .holo {
            position: relative; width: 35vh; height:35vh; transform-style: preserve-3d;
            opacity: 0; transition: opacity 3s ease-in;
        }
        .holo.on { opacity: 0.8; animation: rotateY 18s linear infinite; }

        @keyframes rotateY { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .text-bottom {
            position: absolute; top: 58vh; width: 100%; text-align: center;
            font-size: clamp(20px, 4.5vw, 36px); z-index: 20;
            pointer-events: auto;
        }

        .boadilla {
            position: absolute; bottom: 15vh; left: 50%; transform: translateX(-50%);
            text-align: center; opacity: 0; transition: opacity 1s;
            font-size: clamp(14px, 3vw, 18px); z-index: 10; width: 100%;
            cursor: pointer;
        }

        .beam {
            position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 50vh;
            background: radial-gradient(ellipse at bottom, rgba(0,229,255,0.5), transparent 70%);
            filter: blur(5vh); opacity: 0;
            transition: opacity 4s ease-out;
            z-index: 1; pointer-events: none;
        }
        .beam.on { opacity: 1; }

        #cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--cyan);
            margin-left: 5px;
            animation: blink 1s steps(1) infinite;
            vertical-align: middle;
        }
        
        #telemetryStream {
            width: 85%;
            max-width: 450px;
            margin: 0 auto;
            height: 220px;
            overflow: hidden;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            line-height: 1.4;
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding: 15px 10px;
            opacity: 0.85;
            white-space: pre-wrap;
            position: relative;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <div class="scanlines"></div>
    <div id="signal-noise"></div>
    
    <!-- BOTÓN DE SALTO OCULTO --> 
    <button id="skip-all" onclick="skipToFinalScene()">.</button> 

    <div id="intro">
        <div class="secret-barcode barcode-top">Has encontrado los planos secretos. Por favor no se los des a los Rebeldes.</div>
        <div class="secret-barcode barcode-bottom">En serio te has puesto a descifrar esto... Haztelo mirar. De verdad.</div>
        
        <div class="fixed-layout-container">
            <!-- El logo ahora permite activar la nave forzada -->
            <img id="intro-logo" src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="holo-filter" onclick="forceShipSelection()">
            <div id="introTitle"></div>
            <div id="introTouch"></div>
            <div style="height: 120px; display: flex; align-items: center; justify-content: center; width: 100%;">
                <button id="security-scan-btn">Initiate security scan</button>
            </div>
        </div>
    </div>

    <div id="loading" style="display:none;">
        <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="loading-top-emblem holo-filter">
        <div class="loading-holo-container">
            <img id="loadingShip" class="holo-filter">
            <div class="loading-text-block">
                <div id="loadingText"></div>
                <div id="telemetryStream"></div>
            </div>
        </div>
    </div>

    <div id="access" style="display:none; transition: opacity 0.8s;">
        <div id="accessText" style="letter-spacing: 0.5em; font-size: 24px;"></div>
    </div>
    
    <div id="content" style="display:none;">
        <div class="separator-line sep-top"></div>
        <div class="separator-line sep-bottom"></div>

        <div class="ship-container pos-1">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-1"></div>
        </div>
        
        <div class="ship-container pos-2">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-2"></div>
        </div>

        <div class="ship-container pos-3">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-3"></div>
        </div>

        <div class="ship-container pos-4">
            <img class="ship-deco holo-filter">
            <div class="ship-data" id="data-4"></div>
        </div>

        <div class="imperial-block" onclick="triggerHack()">
            <img id="main-logo" src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp" class="holo-filter">
            <div id="impCommText">IMPERIAL COMMUNICATION SYSTEM</div>
        </div>
        
        <!-- HUD Izquierdo: Countdown -->
        <div id="countdownHud" class="hud-panel">
            <span id="cDigits">00:00:00:00</span>
            <span id="cUnit"></span>
        </div>

        <!-- HUD Derecho: Velocity -->
        <div id="velocityHud" class="hud-panel">
            <span id="vDigits">000000</span>
            <span id="vUnit">MGLT</span>
        </div>

        <div class="text-main">
            <span id="mainText"></span><span id="cursor" style="display:none;"></span>
        </div>

        <div class="scene">
            <div class="holo">
                <img src="https://uploads.onecompiler.io/44nfcewhu/44qr987r5/test_sello2_cropp_fin.png" style="width:100%; height:100%; object-fit:contain;" class="holo-filter">
            </div>
        </div>

        <div class="text-bottom">
            <div id="names"></div>
            <div id="date" style="margin-top: 5px;"></div>
        </div>

        <div class="beam"></div>

        <div class="boadilla" id="boadilla" onclick="triggerWarp()">
            <div class="planet">
                <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/background-with-geometric-linear-sphere.png" style="width:70px;" class="holo-filter">
            </div>
            <div id="boadillaText"></div>
        </div>
    </div>

    <script>
        const shipCatalog = {
            "try_star_wars_xwing_anim.gif": { id: "T-65B", class: "X-WING" },
            "try_star_wars_TIE_anim.gif": { id: "TIE/IN", class: "TIE INTERCEPT." },
            "try_star_wars_imperial_anim.gif": { id: "T-4A", class: "LAMBDA SHUTTLE" },
            "try_star_wars_falcon_anim.gif": { id: "YT-1300", class: "FALCON" },
            "try_star_wars_destructor2_anim.gif": { id: "ISD-II", class: "STAR DESTROYER" },
            "try_star_wars_anim.gif": { id: "FETT-1", class: "SLAVE-I" },
            "nave_espacial-16-all_anim.gif": { id: "SCT-V9", class: "RECON SCOUT" },
            "nave_espacial-10-all_anim.gif": { id: "FRG-C1", class: "FRIGATE" }
        };
        
        // Función auxiliar para obtener datos por URL
        function getSpecsByUrl(url) {
            const fileName = url.split('/').pop();
            return shipCatalog[fileName] || { id: "UNK-00", class: "UNKNOWN CLASS" };
        }
        
        // --- VARIABLES DE CONFIGURACIÓN ---
        const nave_forzada = "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_falcon_anim.gif";
        const nave_forzada_rebelde = "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_xwing_anim.gif";
        let forcedShipActive = false;
        let rebelForcedActive = false;
        
        let chosenShipIndex = -1; // Guardará el índice de la nave seleccionada para el escaneo
        
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let warpState = "IDLE"; 
        let warpFactor = 0;
        let warpLength = 1;
        
        let shipVelocity = 85;
        let displayedVelocity = 85;
        let lastHudUpdate = 0;
        const hudUpdateInterval = 20;
        
        const targetDate = new Date("2027-05-01T12:00:00+02:00").getTime(); 
        
        let shipSpecs = [
            { id: "SCANNING", class: "..." },
            { id: "SCANNING", class: "..." },
            { id: "SCANNING", class: "..." },
            { id: "SCANNING", class: "..." }
        ];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 400; i++) {
                addStar(true);
            }
        }

        function addStar(randomDist = false) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.2,
                speed: Math.random() * 0.2 + 0.05,
                opacity: Math.random() * 0.5 + 0.5
            });
        }

        function drawStars(timestamp) {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const dx = star.x - centerX;
                const dy = star.y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx);

                if (warpState !== "IDLE") {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.lineWidth = star.size;
                    ctx.beginPath();
                    ctx.moveTo(star.x, star.y);
                    const stretch = warpLength * (dist / 100);
                    ctx.lineTo(star.x + Math.cos(angle) * stretch, star.y + Math.sin(angle) * stretch);
                    ctx.stroke();
                    star.x += Math.cos(angle) * warpFactor * (dist / 150 + 0.5);
                    star.y += Math.sin(angle) * warpFactor * (dist / 150 + 0.5);
                    
                    shipVelocity = 85 + Math.pow(warpFactor, 2.7) * 85;
                    
                    if (star.x < 0 || star.x > canvas.width || star.y < 0 || star.y > canvas.height) {
                        star.x = centerX + (Math.random() - 0.5) * 20;
                        star.y = centerY + (Math.random() - 0.5) * 20;
                    }
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    shipVelocity += (Math.random() - 0.5) * 0.4;
                    shipVelocity = Math.max(78, Math.min(92, shipVelocity));
                    
                    const speedMultiplier = (dist / 150) + 0.1;
                    star.x += Math.cos(angle) * star.speed * speedMultiplier * 2;
                    star.y += Math.sin(angle) * star.speed * speedMultiplier * 2;

                    // Si la estrella sale de la pantalla, la reaparecemos en el centro
                    if (star.x < 0 || star.x > canvas.width || star.y < 0 || star.y > canvas.height) {
                        star.x = centerX + (Math.random() - 0.5) * 40;
                        star.y = centerY + (Math.random() - 0.5) * 40;
                    }
                }
            }
            
            const lerpSpeed = (warpState === "BRAKING") ? 0.25 : 0.12;
            displayedVelocity += (shipVelocity - displayedVelocity) * lerpSpeed;

            if (timestamp - lastHudUpdate > hudUpdateInterval) {
                lastHudUpdate = timestamp;
                const vDigits = document.getElementById("vDigits");
                const velocityHud = document.getElementById("velocityHud");
                
                let visualVal = Math.round(displayedVelocity);
                
                if (warpState !== "IDLE" && visualVal > 150) visualVal = Math.floor(visualVal / 5) * 5; 
                
                vDigits.textContent = visualVal.toString().padStart(0, '0');
                
                if (visualVal >= 80000) velocityHud.classList.add("overload");
                else velocityHud.classList.remove("overload");
                
                // Actualizar Countdown
                const now = new Date().getTime();
                const diff = targetDate - now;
                if (diff > 0) {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);
                    const decs = Math.floor((diff % 1000) / 10);
                    document.getElementById("cDigits").textContent = 
                        `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}:${decs.toString().padStart(2,'0')}`;
                } else {
                    document.getElementById("cDigits").textContent = "00:00:00:00";
                }
                
            }

            if (warpState === "STRETCHING") {
                warpFactor += 0.05;
                warpLength += 0.4;
                if (warpLength >= 12) warpState = "ACCELERATING";
            } else if (warpState === "ACCELERATING") {
                warpFactor += 1.3;
                warpLength += 4.5;
                if (warpFactor >= 45) warpState = "BRAKING";
            } else if (warpState === "BRAKING") {
                warpFactor *= 0.88; 
                warpLength *= 0.85; 
                if (warpLength < 1.05) {
                    warpFactor = 0;
                    warpLength = 1;
                    warpState = "IDLE";
                }
            }
            requestAnimationFrame(drawStars);
        }

        function updateShipData() {
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`data-${i}`);
                if (!el) continue;
                el.innerHTML = generateShipTelemetry(shipSpecs[i - 1], shipRuntimeData[i - 1]);
            }
        }

        const shipRuntimeData = shipSpecs.map(spec => ({
            shield: rand(82, 100),
            velocity: rand(40, 120),
            coordX: rand(10, 99) + rand(0, 99) / 100,
            coordY: rand(10, 99) + rand(0, 99) / 100
        }));
        
        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function generateShipTelemetry(spec, runtime) {
            const rebelMode = document.body.classList.contains("rebel-mode");
            if (rebelMode) {
                return `ID:          ${spec.id}\nCLASS:       ${spec.class}\nMISSION:     <span class="rebel-blink">SIGNAL LOST</span>\nDESTINATION: <span class="rebel-blink">UNKNOWN</span>\nSHIELD:      <span class="rebel-blink">OFFLINE</span>\nVELOCITY:    <span class="rebel-blink">0000 MGLT</span>\nCOORD:       <span class="rebel-blink">[MISSING LOC.]</span>`;
            }
            runtime.shield = fluctuate(runtime.shield, 72, 100, 0.5);
            runtime.velocity = fluctuate(runtime.velocity, 20, 120, 2);
            runtime.coordX = fluctuate(runtime.coordX, 10, 99, 0.05);
            runtime.coordY = fluctuate(runtime.coordY, 10, 99, 0.05);
            
            return `ID:          ${spec.id}\nCLASS:       ${spec.class}\nMISSION:     ${spec.mission}\nDESTINATION: ${spec.destination}\nSHIELD:      ${Math.round(runtime.shield)}%\nVELOCITY:    ${Math.round(runtime.velocity)} MGLT\nCOORD:       [${runtime.coordX.toFixed(2)}, ${runtime.coordY.toFixed(2)}]`;
        }

        function fluctuate(value, min, max, delta = 1) {
            value += (Math.random() * delta * 2) - delta;
            return Math.max(min, Math.min(max, value));
        }

        function triggerGlitchSlice(intensity = 5, duration = 200) {
            const body = document.body;
            for(let i=0; i<intensity; i++) {
                const slice = document.createElement('div');
                slice.className = 'glitch-slice';
                const topPos = Math.random() * 100;
                const h = Math.random() * 10 + 2;
                slice.style.top = topPos + 'vh';
                slice.style.height = h + 'px';
                slice.style.transform = `translateX(${(Math.random() - 0.5) * 30}px)`;
                
                
                document.body.appendChild(slice);
                body.style.transform = `translateX(${(Math.random() - 0.5) * 10}px)`;
                setTimeout(() => { slice.remove(); body.style.transform = ''; }, duration);
            }
        }

        function triggerWarp() {
            if (warpState !== "IDLE") return;
            warpState = "STRETCHING";
            setTimeout(() => { if (warpState !== "IDLE") warpState = "BRAKING"; }, 2500); 
        }

        function triggerHack() {
            updateShipData();
            document.body.classList.add('noise-active');
            const glitchInterval = setInterval(() => triggerGlitchSlice(8, 150), 100);
            setTimeout(() => {
                clearInterval(glitchInterval);
                document.body.classList.remove('noise-active');
                const isRebel = document.body.classList.toggle('rebel-mode');
                const logo = document.getElementById('main-logo');
                const text = document.getElementById('impCommText');
                if (isRebel) {
                    logo.src = "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/Rebel_Alliance_logo.svg.png";
                    text.textContent = "REBEL INTERFERENCE DETECTED";
                } else {
                    logo.src = "https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp";
                    text.textContent = "IMPERIAL COMMUNICATION SYSTEM";
                }
            }, 500);
        }

        const shipGifs = [
            //"https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_xwing_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_TIE_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_imperial_anim.gif",
            //"https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_falcon_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_destructor2_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/try_star_wars_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/nave_espacial-16-all_anim.gif",
            "https://uploads.onecompiler.io/44nfcewhu/44nuu9kzj/nave_espacial-10-all_anim.gif"
        ];
                
        function forceShipSelection() {
        
            // si ya está activado el modo rebelde, no hacer nada
            if (rebelForcedActive) return;
        
            // 10% de probabilidad de activar variante rebelde
            if (Math.random() < 0.10) {
                rebelForcedActive = true;
                forcedShipActive = true;
                
                triggerGlitchSlice(9, 400);
        
                const logo = document.getElementById('intro-logo');
                logo.src = "https://uploads.onecompiler.io/44nfcewhu/44nk5qp7d/Rebel_Alliance_logo.svg.png";
                logo.style.filter = "brightness(0) saturate(100%) invert(25%) sepia(100%) saturate(6000%) hue-rotate(330deg) brightness(1.1)";
            } else {
                forcedShipActive = true;
                
                triggerGlitchSlice(3, 100);
                
        
                const logo = document.getElementById('intro-logo');
                logo.style.filter = "brightness(2) drop-shadow(0 0 10px white)";
                setTimeout(() => {
                    logo.style.filter = "";
                }, 300);
            }
        }

        const telemetryTemplates = [
            `      VESSEL ID ................. ISD-${rand(100,999)}\n      REACTOR OUTPUT ............ ${rand(82, 100)}%\n      SHIELD INTEGRITY .......... ${rand(70, 100)}%\n      HYPERDRIVE STATUS ......... ONLINE`,
            `      SCANNING VESSEL...\n      COMM INTERFERENCE ......... ${rand(0,20)}%\n      TARGET LOCK ............... CONFIRMED\n      SIGNAL CLARITY ............ OPTIMAL`,
            `      POWER GRID LOAD ........... ${rand(400,900)} MW\n      FUEL RESERVES ............. ${rand(60,100)}%\n      LIFE SUPPORT .............. NOMINAL\n      COOLANT SYSTEM ............ STABLE`
        ];

        let telemetryInterval;
        function startTelemetryStream() {
            const stream = document.getElementById("telemetryStream");
            telemetryInterval = setInterval(() => {
                const block = telemetryTemplates[Math.floor(Math.random() * telemetryTemplates.length)];
                stream.innerHTML += block + "\n\n";
                if (stream.innerHTML.length > 2000) stream.innerHTML = stream.innerHTML.slice(800);
                stream.scrollTop = stream.scrollHeight;
            }, 500); 
        }

        function type(el, text, speed, callback, pauses = {}) {
            let i = 0; el.textContent = "";
            function t() {
                if (i < text.length) { 
                    el.textContent += text[i];
                    let p = pauses[i] || 0;
                    i++;
                    setTimeout(t, speed + p); 
                } else if (callback) callback();
            }
            t();
        }

        window.onload = () => {
            initStars();
            requestAnimationFrame(drawStars);
            setInterval(updateShipData, 800); 
            
            type(document.getElementById("introTitle"), "IMPERIAL TRANSMISSION", 50, () => {
                type(document.getElementById("introTouch"), "secure channel request", 40, () => {
                    document.getElementById("security-scan-btn").style.display = "block";
                });
            });
        };
        
                // FUNCIÓN PARA SALTAR DIRECTAMENTE AL FINAL
        function skipToFinalScene() {
            // Detener posibles intervalos de carga
            clearInterval(telemetryInterval);
            
            // Ocultar todas las pantallas previas
            document.getElementById("intro").style.display = "none";
            document.getElementById("loading").style.display = "none";
            document.getElementById("access").style.display = "none";
            document.getElementById("skip-all").style.display = "none";
            
            // Mostrar contenido principal
            document.getElementById("content").style.display = "block";
            
            // Simular asignación de naves aleatorias si no se forzó nada
            if (chosenShipIndex === -1) chosenShipIndex = 0;
            
            // Configurar escena final inmediatamente
            setupFinalContent();
            
            // Mostrar elementos de la escena de forma inmediata (sin transiciones lentas)
            document.querySelectorAll('.ship-container').forEach(c => c.style.opacity = "1");
            document.querySelector(".imperial-block").classList.add("show");
            document.querySelector(".beam").classList.add("on");
            document.querySelector(".holo").classList.add("on");
            document.getElementById("cursor").style.display = "inline-block";
            
            // Poner textos finales directamente
            document.getElementById("mainText").textContent = "Save the date...";
            document.getElementById("names").textContent = "Irene & Nacho";
            document.getElementById("date").textContent = "01.05.2027";
            document.getElementById("boadilla").style.opacity = "1";
            document.getElementById("boadillaText").textContent = "BOADILLA DEL MONTE";
        }

        function setupFinalContent() {
            const remainingShips = shipGifs.filter((_, index) => index !== chosenShipIndex);
            const shipsMenuUrls = [...remainingShips].sort(() => 0.5 - Math.random()).slice(0, 4);
            
            document.querySelectorAll('.ship-container img').forEach((img, i) => {
                const url = shipsMenuUrls[i];
                img.src = url;
                const meta = getSpecsByUrl(url);
                shipSpecs[i] = {
                    ...meta,
                    mission: pick(["ESCORT DETAIL", "RECON SWEEP", "SECTOR PATROL", "SURVEILLANCE"]),
                    destination: pick(["CORUSCANT", "NABOO", "TATOOINE", "SCARIF", "HOTH"])
                };
            });
        }

        document.getElementById("security-scan-btn").onclick = () => {
            document.getElementById("intro").style.display = "none";
            const loading = document.getElementById("loading");
            loading.style.display = "flex";
            
            // Lógica de selección de nave
            if (forcedShipActive) {
                if (rebelForcedActive) {
                    chosenShipIndex = shipGifs.indexOf(nave_forzada_rebelde);
                    document.getElementById("loadingShip").src = nave_forzada_rebelde;
                } else {
                    chosenShipIndex = shipGifs.indexOf(nave_forzada);
                    document.getElementById("loadingShip").src = nave_forzada;
                }
            } else {
                chosenShipIndex = Math.floor(Math.random() * shipGifs.length);
                document.getElementById("loadingShip").src = shipGifs[chosenShipIndex];
            }
            
            startTelemetryStream();

            type(document.getElementById("loadingText"), "SCANNING SHIP SIGNATURE...", 45, () => {
                setTimeout(() => {
                    document.getElementById("loadingText").textContent = "";
                    type(document.getElementById("loadingText"), "VERIFYING IMPERIAL CLEARANCE...", 45, () => {
                        setTimeout(() => {
                            document.querySelector(".loading-holo-container").style.opacity = "0";
                            setTimeout(() => {
                                clearInterval(telemetryInterval);
                                loading.style.display = "none";
                                const access = document.getElementById("access");
                                access.style.display = "flex";
                                access.style.opacity = "1";
                                document.getElementById("accessText").textContent = "ACCESS GRANTED";
                                setTimeout(() => document.getElementById("accessText").classList.add("terminal-message"), 50);
                                setTimeout(() => {
                                    access.style.opacity = "0";
                                    setTimeout(() => { access.style.display = "none"; startMainScene(); }, 800);
                                }, 1800);
                            }, 600);
                        }, 900);
                    });
                }, 900);
            });
        };

        function startMainScene() {
            document.getElementById("content").style.display = "block";
            document.querySelectorAll('.ship-container').forEach(c => c.style.opacity = "1");
            document.getElementById("skip-all").style.display = "none"; // Ocultar skip si ya empezó
            
            setupFinalContent();
        
            setTimeout(() => {
                document.querySelector(".imperial-block").classList.add("show");
                type(document.getElementById("impCommText"), "IMPERIAL COMMUNICATION SYSTEM", 40, () => {
                    setTimeout(() => {
                        document.querySelector(".beam").classList.add("on");
                        setTimeout(() => {
                            document.querySelector(".holo").classList.add("on");
                            setTimeout(() => {
                                document.getElementById("cursor").style.display = "inline-block";
                                type(document.getElementById("mainText"), "Save the date...", 140, () => {
                                    setTimeout(typeFinalInfo, 1000);
                                }, { 3: 600, 7: 600 });
                            }, 3000);
                        }, 200);
                    }, 200);
                });
            }, 500);
        }

        function typeFinalInfo() {
            type(document.getElementById("names"), "Irene & Nacho", 80, () => {
                setTimeout(() => {
                    type(document.getElementById("date"), "01.05.2027", 120, () => {
                        setTimeout(() => {
                            document.getElementById("boadilla").style.opacity = "1";
                            type(document.getElementById("boadillaText"), "BOADILLA DEL MONTE", 60);
                        }, 750);
                    });
                }, 750);
            });
        }

        window.onresize = initStars;
    </script>
