<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Holograma</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:'Orbitron', monospace;
  color:#00e5ff;
}

/* ===== ESCALADO GLOBAL RESPONSIVE ===== */
:root{
  --holo-size: clamp(180px, 28vw, 340px);
  --text-main: clamp(22px, 3vw, 42px);
  --text-small: clamp(10px, 1.2vw, 14px);
  --text-mid: clamp(14px, 1.6vw, 22px);
}

/* ===== SCANLINES ===== */
.scanlines {
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,229,255,0.06) 0px,
    rgba(0,229,255,0.06) 2px,
    transparent 2px,
    transparent 5px
  );
  pointer-events:none;
  z-index:99999;
}

/* ===== IMAGENES (FIX MODO OSCURO MÓVIL) ===== */
img {
  filter:
    brightness(0.2)
    contrast(1.6)
    sepia(1)
    saturate(10)
    hue-rotate(155deg)
    drop-shadow(0 0 10px #00e5ff);
  -webkit-filter:
    brightness(0.2)
    contrast(1.6)
    sepia(1)
    saturate(10)
    hue-rotate(155deg)
    drop-shadow(0 0 10px #00e5ff);
  mix-blend-mode: screen;
}

/* ===== INTRO ===== */
#intro {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:10000;
}

#intro img { width:60px; margin-top:12px; }

#intro .imperial {
  font-size:clamp(18px, 2.5vw, 32px);
  margin-bottom:20px;
}

#intro .touch {
  font-size:var(--text-small);
  opacity:0.8;
}

/* ===== LOADING ===== */
#loading {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner {
  width:40px;
  height:40px;
  border:2px solid rgba(0,229,255,0.2);
  border-top:2px solid #00e5ff;
  border-radius:50%;
  animation: spin 1s linear infinite;
  margin-bottom:12px;
}

@keyframes spin { to { transform:rotate(360deg); } }

/* ===== ACCESS ===== */
#access {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:20px;
  letter-spacing:3px;
  z-index:9998;
  transition:opacity 1.5s ease;
}

#access.fade { opacity:0; }

/* ===== CONTENIDO ===== */
#content { display:none; }

/* ===== IMPERIAL ===== */
.imperial-block {
  position:fixed;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0;
  filter:blur(10px);
  transition:all 1.8s ease;
}

.imperial-block.show {
  opacity:1;
  filter:blur(0);
}

.imperial-block img {
  width:clamp(50px, 6vw, 80px);
  margin-bottom:18px;
}

/* ===== TEXTOS ===== */
.text-main {
  position:fixed;
  top:28%;
  width:100%;
  text-align:center;
  font-size:var(--text-main);
}

.text-bottom {
  position:fixed;
  bottom:18%;
  width:100%;
  text-align:center;
  font-size:var(--text-mid);
  opacity:0;
  filter:blur(6px);
  transition:all 1.2s ease;
}

.text-bottom.show {
  opacity:1;
  filter:blur(0);
}

.cursor {
  display:inline-block;
  width:10px;
  height:26px;
  background:#00e5ff;
  margin-left:6px;
  animation:blink 1.2s steps(1) infinite;
}

@keyframes blink { 50% { opacity:0; } }

/* ===== HOLOGRAMA CENTRADO REAL ===== */
.scene {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1000px;
}

.holo {
  position:relative;
  width:var(--holo-size);
  height:var(--holo-size);
  transform-style:preserve-3d;
  opacity:0;
  transition:opacity 2s ease;
}

.holo.on {
  opacity:1;
  animation: rotateY 22s linear infinite;
}

/* capas */
.layer {
  position:absolute;
  inset:0;
}

.layer img {
  width:100%;
}

/* profundidad */
.layer:nth-child(1) { transform:translateZ(0px); }
.layer:nth-child(2) { transform:translateZ(-6px); opacity:0.85; }
.layer:nth-child(3) { transform:translateZ(-12px); opacity:0.6; }
.layer:nth-child(4) { transform:translateZ(-18px); opacity:0.4; }

@keyframes rotateY {
  from { transform:rotateY(0deg); }
  to   { transform:rotateY(360deg); }
}

/* ===== BEAM ===== */
.beam {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:clamp(220px, 30vw, 360px);
  height:420px;
  background:radial-gradient(ellipse at bottom,rgba(0,200,255,0.5),transparent 70%);
  filter:blur(22px);
  opacity:0;
  transition:opacity 1.2s ease;
}

.beam.on {
  opacity:1;
  animation:beamPulse 1.8s ease-in-out infinite;
}

@keyframes beamPulse {
  0% { transform:translateX(-50%) scaleY(0.9); }
  50% { transform:translateX(-50%) scaleY(1.1); }
  100% { transform:translateX(-50%) scaleY(0.9); }
}

/* ===== BOADILLA ===== */
.boadilla {
  position:fixed;
  bottom:8%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0;
  filter:blur(6px);
  transition:all 1.5s ease;
}

.boadilla.show {
  opacity:1;
  filter:blur(0);
}

.planet img {
  width:clamp(50px, 6vw, 80px);
}

/* ===== SCANLINES ===== */
.scanlines {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99999;
}

</style>
</head>

<body>

<div class="scanlines"></div>

<div id="intro">
  <div class="imperial">IMPERIAL TRANSMISSION</div>
  <div class="touch">touch to confirm identity</div>
  <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/880868.png">
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>verifying identity...</div>
</div>

<div id="access">ACCESS APPROVED</div>

<div id="content">

<div class="imperial-block">
  <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp">
  <div>Este es un comunicado del imperio.</div>
</div>

<div class="text-main">
  <span id="mainText"></span><span class="cursor"></span>
</div>

<div class="text-bottom" id="bottomText">
  <div id="names"></div>
  <div id="date"></div>
</div>

<div class="scene">
  <div class="holo">
    <div class="layer"><img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png"></div>
    <div class="layer"><img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png"></div>
    <div class="layer"><img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png"></div>
    <div class="layer"><img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png"></div>
  </div>
</div>

<div class="beam"></div>

<div class="boadilla" id="boadilla">
  <div class="planet">
    <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/background-with-geometric-linear-sphere.png">
  </div>
  <div>BOADILLA</div>
</div>

</div>

<script>

intro.onclick = () => {
  intro.style.display="none";
  loading.style.display="flex";

  setTimeout(()=>{
    loading.style.display="none";
    access.style.display="flex";

    setTimeout(()=>{
      access.classList.add("fade");

      setTimeout(()=>{
        access.style.display="none";
        start();
      },1500);

    },1200);

  },1800);
};

function start(){
  content.style.display="block";

  setTimeout(()=>{
    document.querySelector(".imperial-block").classList.add("show");
  },900);

  setTimeout(()=>{
    document.querySelector(".beam").classList.add("on");

    setTimeout(()=>{
      document.querySelector(".holo").classList.add("on");
    },1400);

  },3200);

  setTimeout(typeText,5400);
}

function type(el, text, speed, cb){
  let i=0;
  el.textContent="";
  function t(){
    if(i<text.length){
      el.textContent+=text[i++];
      setTimeout(t,speed);
    } else if(cb) cb();
  }
  t();
}

function typeText(){
  type(mainText,"Save the date...",70);

  setTimeout(()=>{
    bottomText.classList.add("show");

    type(names,"Irene & Nacho",60,()=>{
      setTimeout(()=>type(date,"15-05-2027",60),200);
    });

  },1200);

  setTimeout(()=>{
    boadilla.classList.add("show");
  },2600);
}

</script>

</body>
</html>
