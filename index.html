<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holograma</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:'Orbitron', monospace;
  color:#00e5ff;
  color-scheme: dark;
}

/* ===== SCANLINES ===== */
.scanlines {
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 0.3vh,
    transparent 0.3vh,
    transparent 0.6vh
  );
  pointer-events:none;
  z-index:99999;
}

/* ===== GLOBAL IMAGE RECOLOR ===== */
img {
  filter:
    brightness(0)
    invert(1)
    sepia(1)
    saturate(12)
    hue-rotate(165deg)
    brightness(0.9)
    contrast(1.15)
    drop-shadow(0 0 1.5vh #00e5ff);
  mix-blend-mode: screen;
}

/* ===== INTRO ===== */
#intro {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10000;
  text-align:center;
}

#intro img {
  width: clamp(70px, 12vw, 140px);
}

#intro .imperial {
  font-size: clamp(28px, 6vw, 56px);
  text-shadow:0 0 1.5vh #00e5ff;
  margin-bottom:2vh;
}

#intro .touch {
  font-size: clamp(14px, 3vw, 22px);
  opacity:0.8;
  letter-spacing:0.3em;
}

/* ===== LOADING ===== */
#loading {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner {
  width: clamp(35px, 8vw, 60px);
  height: clamp(35px, 8vw, 60px);
  border:2px solid rgba(0,229,255,0.2);
  border-top:2px solid #00e5ff;
  border-radius:50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

/* ===== ACCESS ===== */
#access {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size: clamp(22px, 5vw, 40px);
  letter-spacing:0.3em;
  text-shadow:0 0 1.5vh #00e5ff;
  z-index:9998;
  transition:opacity 1.5s ease;
}

#access.fade { opacity:0; }

/* ===== CONTENIDO ===== */
#content { display:none; }

/* ===== IMPERIAL ===== */
.imperial-block {
  position:fixed;
  top:10vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0;
  filter:blur(10px);
  transition:all 1.8s ease;
  font-size: clamp(16px, 3.5vw, 30px);
}

.imperial-block.show {
  opacity:1;
  filter:blur(0);
}

.imperial-block img {
  width: clamp(70px, 10vw, 120px);
  margin-bottom:2vh;
}

/* ===== TEXTOS ===== */
.text-main {
  position:fixed;
  top:28vh;
  width:100%;
  text-align:center;
  font-size: clamp(30px, 7vw, 70px);
}

.text-bottom {
  position:fixed;
  bottom:18vh;
  width:100%;
  text-align:center;
  font-size: clamp(20px, 5vw, 40px);
  opacity:0;
  filter:blur(6px);
  transition:all 1.2s ease;
}

.text-bottom.show {
  opacity:1;
  filter:blur(0);
}

.cursor {
  display:inline-block;
  width:1vw;
  height:4vh;
  background:#00e5ff;
  margin-left:0.8vw;
  animation:blink 1.2s steps(1) infinite;
}

@keyframes blink { 50% { opacity:0; } }

/* ===== HOLOGRAMA ===== */
.scene {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1000px;
}

.holo {
  position:relative;
  width:50vw;
  height:50vw;
  transform-style:preserve-3d;
  opacity:0;
  transition:opacity 2s ease;
}

.holo.on {
  opacity:1;
  animation: rotateY 18s linear infinite;
}

.holo img {
  width:100%;
}

@keyframes rotateY {
  from { transform:rotateY(0deg); }
  to   { transform:rotateY(360deg); }
}

/* ===== BEAM ===== */
.beam {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:50vw;
  height:50vh;
  background:radial-gradient(ellipse at bottom,rgba(0,200,255,0.5),transparent 70%);
  filter:blur(2.5vh);
  opacity:0;
  transition:opacity 1.2s ease;
}

.beam.on {
  opacity:1;
  animation:beamPulse 1.8s ease-in-out infinite;
}

@keyframes beamPulse {
  0% { transform:translateX(-50%) scaleY(0.9); }
  50% { transform:translateX(-50%) scaleY(1.1); }
  100% { transform:translateX(-50%) scaleY(0.9); }
}

/* ===== BOADILLA ===== */
.boadilla {
  position:fixed;
  bottom:8vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0;
  filter:blur(6px);
  transition:all 1.5s ease;
  font-size: clamp(18px, 4vw, 34px);
}

.boadilla.show {
  opacity:1;
  filter:blur(0);
}

.planet img {
  width:50vw;
  max-width:420px;
}

</style>
</head>

<body>

<div class="scanlines"></div>

<div id="intro">
  <div class="imperial">IMPERIAL TRANSMISSION</div>
  <div class="touch">touch to confirm identity</div>
  <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/880868.png">
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>verifying identity...</div>
</div>

<div id="access">ACCESS APPROVED</div>

<div id="content">

<div class="imperial-block">
  <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp">
  <div>Este es un comunicado del imperio.</div>
</div>

<div class="text-main">
  <span id="mainText"></span><span class="cursor"></span>
</div>

<div class="text-bottom" id="bottomText">
  <div id="names"></div>
  <div id="date"></div>
</div>

<div class="scene">
  <div class="holo">
    <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png">
  </div>
</div>

<div class="beam"></div>

<div class="boadilla" id="boadilla">
  <div class="planet">
    <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/background-with-geometric-linear-sphere.png">
  </div>
  <div><span id="boadillaText"></span></div>
</div>

</div>

<script>

const boadillaText = document.getElementById("boadillaText");

intro.onclick = () => {
  intro.style.display="none";
  loading.style.display="flex";

  setTimeout(()=>{
    loading.style.display="none";
    access.style.display="flex";

    setTimeout(()=>{
      access.classList.add("fade");

      setTimeout(()=>{
        access.style.display="none";
        start();
      },1500);

    },1200);

  },1800);
};

function start(){
  content.style.display="block";

  setTimeout(()=>{
    document.querySelector(".imperial-block").classList.add("show");
  },800);

  setTimeout(()=>{
    document.querySelector(".beam").classList.add("on");

    setTimeout(()=>{
      document.querySelector(".holo").classList.add("on");
    },1200);

  },3000);

  setTimeout(typeText,5200);
}

function type(el, text, speed, callback){
  let i = 0;
  el.textContent = "";

  function t(){
    if(i < text.length){
      el.textContent += text[i++];
      setTimeout(t, speed);
    } else {
      if(callback) callback();
    }
  }

  t();
}

function typeText(){
  type(mainText, "Save the date...", 70);

  setTimeout(()=>{
    bottomText.classList.add("show");

    type(names, "Irene & Nacho", 60, ()=>{
      setTimeout(()=>{
        type(date, "15-05-2027", 60);
      }, 200);
    });

  }, 1200);

  setTimeout(()=>{
    boadilla.classList.add("show");

    setTimeout(()=>{
      type(boadillaText, "BOADILLA", 80);
    }, 400);

  }, 2600);
}

</script>

</body>
</html>
