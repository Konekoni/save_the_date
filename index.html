<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holograma Imperial</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:'Orbitron', monospace;
  color:#00e5ff;
  color-scheme: dark;
}

/* ===== SCANLINES ===== */
.scanlines {
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 0.3vh,
    transparent 0.3vh,
    transparent 0.6vh
  );
  pointer-events:none;
  z-index:99999;
}

/* ===== GLOBAL IMAGE RECOLOR ===== */
img {
  filter:
    brightness(0)
    invert(1)
    sepia(1)
    saturate(12)
    hue-rotate(165deg)
    brightness(0.9)
    contrast(1.15)
    drop-shadow(0 0 1.5vh #00e5ff);
  mix-blend-mode: screen;
}

/* ===== PANTALLAS INICIALES ===== */
#intro, #loading, #access {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10000;
  text-align:center;
  background: black;
}

#intro img { width: clamp(70px, 10vw, 140px); }
#intro .imperial { font-size: clamp(38px, 6vw, 56px); text-shadow:0 0 1.5vh #00e5ff; margin-bottom:2vh; }
#intro .touch { font-size: clamp(14px, 3vw, 22px); opacity:0.8; letter-spacing:0.4em; margin-bottom:2vh; }

.spinner {
  width: clamp(35px, 8vw, 60px);
  height: clamp(35px, 8vw, 60px);
  border:2px solid rgba(0,229,255,0.2);
  border-top:2px solid #00e5ff;
  border-radius:50%;
  animation: spin 1s linear infinite;  margin-bottom:1vh;
}
@keyframes spin { to { transform:rotate(360deg); } }

#access { font-size: clamp(22px, 5vw, 40px); letter-spacing:0.3em; transition:opacity 1.5s ease; }
#access.fade { opacity:0; }

/* ===== CONTENIDO ===== */
#content { display:none; height: 100vh; width: 100vw; position: relative; }

/* 1. IMPERIAL (Logo superior) */
.imperial-block {
  position:relative;
  top:3vh; /* Un poco más de margen superior */
  text-align:center;
  opacity:0;
  filter:blur(10px);
  transition:all 1.8s ease;
  font-size: clamp(12px, 1.5vw, 13px);
  z-index: 20;
  letter-spacing: 0.2em;
}
.imperial-block.show { opacity:1; filter:blur(0); }
.imperial-block img { width: clamp(35px, 4.5vh, 55px); margin-bottom:1vh; }

/* 2. SAVE THE DATE */
.text-main {
  position:absolute;
  top: 16vh; /* Bajado para que no choque con el logo */
  width:100%;
  text-align:center;
  font-size: clamp(35px, 6.5vw, 48px); /* Tamaño aumentado */
  z-index: 20;
  letter-spacing: 0.05em;
}

/* 3. HOLOGRAMA */
.scene {
  position:absolute;
  top: 48vh; /* Ajustado para dejar espacio al texto superior crecido */
  left: 50%;
  transform: translate(-50%, -50%);
  perspective:1000px;
  z-index: 5;
}
.holo {
  position:relative;
  width: 48vh; 
  height: 48vh;
  transform-style:preserve-3d;
  opacity:0;
  transition:opacity 2s ease;
}
.holo.on { opacity:0.8; animation: rotateY 18s linear infinite; }
.holo img { 
    width:100%; 
    height: 100%; 
    object-fit: contain; 
}

/* 4. NOMBRES Y FECHA */
.text-bottom {
  position:absolute;
  top: 70vh; /* Bajado ligeramente para equilibrar */
  width:100%;
  text-align:center;
  font-size: clamp(22px, 5vw, 42px);
  opacity:0;
  filter:blur(6px);
  transition:all 1.2s ease;
  z-index: 20;
  font-weight: 400;
}
.text-bottom.show { opacity:1; filter:blur(0); }

/* 5. BOADILLA Y PLANETA */
.boadilla {
  position:absolute;
  bottom: 2vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0;
  filter:blur(6px);
  transition:all 1.5s ease;
  font-size: clamp(14px, 3vw, 20px);
  z-index: 10;
}
.boadilla.show { opacity:1; filter:blur(0); }
.planet img {
  width: 22vw;
  max-width: 130px;
  margin-bottom: 0.5vh;
}

/* CURSOR */
.cursor {
  display:none;
  width: clamp(12px, 2vw, 18px);
  height: clamp(12px, 2vw, 18px);
  background:#00e5ff;
  margin-left:8px;
  animation:blink 1s steps(1) infinite;
  vertical-align: middle;
}
.cursor.visible { display: inline-block; }

/* HAZ DE LUZ */
.beam {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:85vw;
  height:65vh;
  background:radial-gradient(ellipse at bottom,rgba(0,200,255,0.3),transparent 75%);
  filter:blur(4vh);
  opacity:0;
  transition:opacity 1.2s ease;
  z-index: 1;
}
.beam.on { opacity:1; animation:beamPulse 2s ease-in-out infinite; }

/* ANIMACIONES */
@keyframes rotateY { from { transform:rotateY(0deg); } to { transform:rotateY(360deg); } }
@keyframes beamPulse {
  0%, 100% { transform:translateX(-50%) scale(0.95); opacity: 0.4; }
  50% { transform:translateX(-50%) scale(1.05); opacity: 0.6; }
}
@keyframes blink { 50% { opacity:0; } }

</style>
</head>
<body>

<div class="scanlines"></div>

<div id="intro">
  <div class="imperial">IMPERIAL TRANSMISSION</div>
  <div class="touch">touch to confirm identity</div>
  <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/880868.png">
</div>

<div id="loading" style="display:none;">
  <div class="spinner"></div>
  <div style="margin-top:15px">verifying identity...</div>
</div>

<div id="access" style="display:none;">ACCESS APPROVED</div>

<div id="content">

  <div class="imperial-block">
    <img src="https://uploads.onecompiler.io/44nfcewhu/44nfb9wuu/Imperial_Emblem.webp">
    <div>imperial communication</div>
  </div>

  <div class="text-main">
    <span id="mainText"></span><span class="cursor" id="cursor"></span>
  </div>

  <div class="scene">
    <div class="holo">
      <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/Sin%20t%C3%ADtulo3.png">
    </div>
  </div>

  <div class="text-bottom" id="bottomText">
    <div id="names"></div>
    <div id="date"></div>
  </div>

  <div class="beam"></div>

  <div class="boadilla" id="boadilla">
    <div class="planet">
      <img src="https://uploads.onecompiler.io/44nfcewhu/44nfd75r4/background-with-geometric-linear-sphere.png">
    </div>
    <div><span id="boadillaText"></span></div>
  </div>

</div>

<script>
const intro = document.getElementById("intro");
const loading = document.getElementById("loading");
const access = document.getElementById("access");
const content = document.getElementById("content");
const cursor = document.getElementById("cursor");

intro.onclick = () => {
  intro.style.display="none";
  loading.style.display="flex";

  setTimeout(()=>{
    loading.style.display="none";
    access.style.display="flex";

    setTimeout(()=>{
      access.classList.add("fade");
      setTimeout(()=>{
        access.style.display="none";
        start();
      },1500);
    },1200);
  },1800);
};

function start(){
  content.style.display="block";

  setTimeout(()=>{
    document.querySelector(".imperial-block").classList.add("show");
  },800);

  setTimeout(()=>{
    cursor.classList.add("visible");
    document.querySelector(".beam").classList.add("on");
    setTimeout(()=>{
      document.querySelector(".holo").classList.add("on");
    },1200);
  },2500);

  setTimeout(typeText,4500);
}

function type(el, text, speed, callback){
  let i = 0;
  el.textContent = "";
  function t(){
    if(i < text.length){
      el.textContent += text[i++];
      setTimeout(t, speed);
    } else if(callback) callback();
  }
  t();
}

function typeText(){
  type(mainText, "Save the date...", 70, () => {
    setTimeout(()=>{
      document.getElementById("bottomText").classList.add("show");
      type(names, "Irene & Nacho", 60, ()=>{
        setTimeout(()=>{
          type(date, "15-05-2027", 60, () => {
            setTimeout(()=>{
              document.getElementById("boadilla").classList.add("show");
              type(boadillaText, "BOADILLA", 80);
            }, 500);
          });
        }, 200);
      });
    }, 800);
  });
}
</script>

</body>
</html>
